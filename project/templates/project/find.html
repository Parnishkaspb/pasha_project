{% extends 'base.html' %}
{% load static %}
{% block title %}
    Поиск человека
{% endblock %}


{% block content %}
<style>
    .search-form {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
    
      .search-form input[type="text"],
      .search-form input[type="hidden"] {
        width: 250px;
        flex: 1;
        padding: 10px;
        border: 1px solid lime;
        border-radius: 5px;
        outline: none;
      }
    
      .search-form button {
        padding: 10px 20px;
        background-color: lime;
        color: black;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    
      .results {
        margin-top: 50px;
        margin-left: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }
      
      .person-card {
        background-color: #f5f5f5;
        padding: 20px;
        border-radius: 5px;
        border: 0.1px solid lime;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      
      .person-card h3 {
        margin-top: 0;
      }
      
      .person-card p {
        margin: 5px 0;
      }
      
      hr {
        border: none;
        border-top: 1px solid #ccc;
      }
</style>
{% include 'inc/_nav.html' %}
    <div class='main'>
        <div class="search-form">
            <form method="post" action="{% url 'find' %}" id='forma'>
                <ul id="whatdo_list_delete"></ul>
                <input type="text" id="whatdo_input" class='form-control' placeholder="Введите деятельность">
                <input type="hidden" id="whatdo_input_hidden"  name="whatdo_input_hidden">
                <ul id="whatdo_list_add"></ul>
                    <ul id="keyword_list_delete"></ul>
                    <input type="text" id="keyword_input" class='form-control' placeholder="Введите ключевые слова">
                    <input type="hidden" id="keyword_input_hidden"  name="keyword_input_hidden">
                    <ul id="keyword_list_add"></ul>
                    <ul id="city_list_delete"></ul>
                    <input type="text" id="city_input" class='form-control' placeholder="Введите название города">
                    <input type="hidden" id="city_input_hidden" name="city_input_hidden">
                    <ul id="city_list_add"></ul>
                    {% csrf_token %}
                <button type="submit">Поиск</button>
            </form>
        </div>
          
          <div class="results" id='results'></div>
    </div>




    <script src="{% static 'js/help_function.js' %}"> </script>
    <script>
        const keyword = document.getElementById('keyword_input');
        const keywordListAdd = document.getElementById('keyword_list_add');

        const city = document.getElementById('city_input');
        const cityListAdd = document.getElementById('city_list_add');

        const whatdo = document.getElementById('whatdo_input');
        const whatdoListAdd = document.getElementById('whatdo_list_add');

        keyword.addEventListener('input', function () {
            NewQuery(keywordListAdd, 'keyword', 'autocompletekeyword', keyword, "{% static 'images/free-icon-add-button-8344983.png' %}", 3)
        });

        city.addEventListener('input', function () {
            NewQuery(cityListAdd, 'city', 'autocompletecity', city, "{% static 'images/free-icon-add-button-8344983.png' %}", 1)
        });

        whatdo.addEventListener('input', function () {
            NewQuery(whatdoListAdd, 'whatdo', 'autocompletewhatdo', whatdo, "{% static 'images/free-icon-add-button-8344983.png' %}", 2)
        });

        $(document).ready(function() {
            $('#forma').submit(function(event) {
                event.preventDefault();
                let formData = $(this).serialize();
            
                $.ajax({
                    type: 'POST',
                    url: '{% url 'find' %}',
                    data: formData,
                    dataType: 'json',
                    success: function(response) {
                        const resultDiv = document.getElementById('results');
                        console.log(response);
                        let word = '';
                        if (response.length == 0) {
                            word += '<h3> Поиск не дал результатов! </h3>';
                        } else {
                            for (let i = 0; i < response.length; i++){
                                let tmp = ''
                                if (response[i].know.length == 10){
                                    tmp += response[i].know;
                                } else {
                                    for (let j = 0; j < response[i].know.length; j++){
                                        if (j == response[i].know.length - 1){
                                            tmp += response[i].know[j];
                                        } else {
                                            tmp += response[i].know[j] + ' --> ';
                                        }
                                    }
                                }
                                
                                word += ' <div class="person-card">'+
                                    '<h3>Имя: ' + response[i].name + '</h3>'+ 
                                    '<p>Чем занимается: ' + response[i].what_do + '</p>'+ 
                                    '<p>Где занимается: ' + response[i].city + '</p>'+ 
                                    '<p>Контактная информация:' + response[i].contact_information + '</p>'+ 
                                    '<hr>'+
                                    '<h3> Связи: ' + tmp + '</h3>' +
                                '</div>'
                            }
                        }
                        resultDiv.innerHTML = word;
                    },
                    error: function(xhr, status, error) {
                        console.log(xhr.responseText);
                    }
                });
            });
        });
